<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LoFi Gen</title>
  <link rel="stylesheet" href="styles.css" />
  <script>
    if (localStorage.getItem("lofi-theme") === "dark") {
      document.documentElement.dataset.theme = "dark";
    }
  </script>
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div>
        <h1 class="app__title">LoFi Gen</h1>
        <p class="app__subtitle">Generador de lo-fi con cadenas de Markov</p>
      </div>

      <button id="themeToggle" class="button button--icon" title="Cambiar tema" aria-label="Cambiar tema">🌙</button>
    </header>

    <div class="controls">
      <button id="toggleButton" class="button button--primary">Start</button>

      <div class="controls__row">
        <div class="field">
          <label class="field__label" for="tempo">Tempo</label>
          <input id="tempo" type="number" min="40" max="200" value="90" />
        </div>

        <div class="field">
          <label class="field__label" for="volume">Volumen</label>
          <input id="volume" type="range" min="0" max="1" step="0.01" value="0.1" />
        </div>

        <div class="field">
          <label class="field__label" for="swing">Swing</label>
          <input id="swing" type="range" min="0" max="1" step="0.01" value="0.2" />
        </div>
      </div>

      <div class="field">
        <label class="field__label" for="seed">Seed</label>
        <div class="field__row">
          <input id="seed" type="text" />
          <button id="randomSeed" class="button button--icon" title="Randomizar seed" aria-label="Randomizar seed">🎲</button>
        </div>
      </div>
    </div>

    <section class="history">
      <h2 class="history__title">Recientes</h2>
      <ul id="historyList" class="history__list"></ul>
    </section>
  </main>

  <footer class="footer">
    <a class="footer__link" href="https://github.com/SantiMit1" target="_blank" rel="noopener noreferrer">santimit</a>
  </footer>

  <script type="module" src="src/main.js"></script>
</body>
</html>
